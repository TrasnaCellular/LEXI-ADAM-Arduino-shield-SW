[env:uno_r4_wifi]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
monitor_speed = 115200
lib_deps = 
	vshymanskyy/TinyGSM@^0.12.0
	arduino-libraries/ArduinoMqttClient@^0.1.8
	vshymanskyy/StreamDebugger@^1.0.1
